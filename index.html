<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4d3a">
  <title>MyGrade</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top"><h1>MyGrade</h1></header>

  <main>
    <!-- 1. Beranda -->
    <section id="view-home" class="view active">
      <div class="hero">
        <p class="hero-label">Rata-rata keseluruhan</p>
        <p class="hero-num" id="homeAvg">–</p>
        <p class="hero-sub"><span id="homeCount">0</span> nilai tersimpan</p>
      </div>
      <button class="btn primary wide" data-go="input">+ Tambah nilai</button>
      <h2>Nilai terbaru</h2>
      <ul class="list" id="recentList"></ul>
    </section>

    <!-- 2. Input Nilai -->
    <section id="view-input" class="view">
      <h2 id="formTitle">Tambah nilai</h2>
      <form id="gradeForm" autocomplete="off">
        <label>Semester
          <select id="semester" required>
            <option value="1">Semester 1</option><option value="2">Semester 2</option>
            <option value="3">Semester 3</option><option value="4">Semester 4</option>
            <option value="5">Semester 5</option><option value="6">Semester 6</option>
          </select>
        </label>
        <label>Mata pelajaran
          <input id="subject" type="text" placeholder="Contoh: Matematika" required maxlength="40">
        </label>
        <label>Nilai (0–100)
          <input id="score" type="number" min="0" max="100" step="0.01" inputmode="decimal" placeholder="90" required>
        </label>
        <button class="btn primary wide" type="submit" id="saveBtn">Hitung &amp; simpan</button>
        <button class="btn wide" type="button" id="cancelEdit" hidden>Batal edit</button>
      </form>
      <div class="result" id="formResult" hidden></div>
    </section>

    <!-- 3. Hasil -->
    <section id="view-result" class="view">
      <h2>Rata-rata per semester</h2>
      <div id="semBars"></div>
      <div class="total">
        <span>Rata-rata keseluruhan</span><strong id="resAvg">–</strong>
      </div>
      <h2>Perkembangan</h2>
      <p id="trendText" class="muted">Belum ada data.</p>
    </section>

    <!-- 4. Pengaturan -->
    <section id="view-settings" class="view">
      <h2>Kelola data</h2>
      <ul class="list" id="manageList"></ul>
      <h2>Cadangan</h2>
      <div class="row">
        <button class="btn" id="exportBtn">Unduh cadangan</button>
        <button class="btn" id="importBtn">Pulihkan</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
      <button class="btn danger wide" id="clearBtn">Hapus semua data</button>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <nav class="tabs">
    <button data-go="home" class="on">Beranda</button>
    <button data-go="input">Input</button>
    <button data-go="result">Hasil</button>
    <button data-go="settings">Atur</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
